[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-benchmark"
version = "0.1.0"
description = "Deterministic repository-level benchmarks for evaluating model harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harnessbench = "harnessbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
